name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (default features)
        working-directory: policy-gateway
        run: cargo test
      - name: Test (lang-en)
        working-directory: policy-gateway
        run: cargo test --features lang-en
      - name: Build (release, default)
        working-directory: policy-gateway
        run: cargo build --release
      - name: Build (tls + auto-heal)
        working-directory: policy-gateway
        run: cargo build --release --features "tls,auto-heal"
      - name: Build VM + vm-mod
        working-directory: policy-gateway
        run: cargo build -p policy-gateway-vm -p vm-mod --release
