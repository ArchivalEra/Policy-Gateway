[package]
name = "policy-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
# TLS
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# HTTP
axum = "0.8"
hyper = { version = "1", features = ["server", "client"] }
tokio = { version = "1", features = ["rt-single-thread", "macros", "net", "io-util"] }
tower = "0.5"
# Crypto
ring = "0.17"
x509-parser = "0.18"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Utils
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
log = "0.4"

