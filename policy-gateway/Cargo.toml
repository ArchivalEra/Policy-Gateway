[package]
name = "policy-gateway"
version = "0.3.6"
edition = "2021"

[features]
default = ["minimize", "frontend"]
frontend = []
minimize = []
modelize = []

compute = []
storage = []

[dependencies]
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
ring = "0.17"
x509-parser = "0.18"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"
redb = "2"
toml = "0.8"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1"] }

[workspace]
resolver = "2"
members = ["vm", "cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

